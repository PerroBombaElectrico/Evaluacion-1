<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cliente API de inventario</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; }
        form { display: grid; gap: .75rem; max-width: 420px; }
        input, button { font: inherit; padding: .55rem; }
        button { cursor: pointer; }
        pre { background: #f4f4f4; overflow: auto; padding: 1rem; }
        .error { color: #a00; }
        .loading { color: #555; }
        .skeleton { animation: pulse 1.2s ease-in-out infinite; background: #e5e5e5; border-radius: 4px; height: 1rem; margin: .5rem 0; max-width: 700px; }
        @keyframes pulse { 50% { opacity: .45; } }
    </style>
</head>
<body>
    <h1>Cliente JavaScript para la API</h1>
    <p>Inicia sesión con un usuario de Django para consultar los productos protegidos.</p>

    <form id="login-form">
        <label>
            Usuario
            <input id="username" name="username" autocomplete="username" required>
        </label>
        <label>
            Contraseña
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Obtener token</button>
    </form>

    <p id="status" role="status"></p>
    <button id="load-products" type="button" disabled>Cargar productos</button>
    <div id="loader" class="loading" hidden aria-label="Cargando productos" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>
    <pre id="result">Aún no se han cargado datos.</pre>

    <script>
        const accessTokenKey = "inventario_access_token";
        const refreshTokenKey = "inventario_refresh_token";
        const statusElement = document.querySelector("#status");
        const resultElement = document.querySelector("#result");
        const loadButton = document.querySelector("#load-products");
        const loaderElement = document.querySelector("#loader");

        function showError(message) {
            statusElement.textContent = message;
            statusElement.className = "error";
        }

        document.querySelector("#login-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            statusElement.textContent = "";

            const response = await fetch("/api/token/", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    username: document.querySelector("#username").value,
                    password: document.querySelector("#password").value
                })
            });

            const data = await response.json();
            if (!response.ok) {
                showError(data.detail || "No fue posible iniciar sesión.");
                return;
            }

            localStorage.setItem(accessTokenKey, data.access);
            localStorage.setItem(refreshTokenKey, data.refresh);
            statusElement.textContent = "Autenticación correcta.";
            loadButton.disabled = false;
        });

        loadButton.addEventListener("click", async () => {
            const accessToken = localStorage.getItem(accessTokenKey);
            if (!accessToken) {
                showError("Primero debes iniciar sesión.");
                return;
            }

            loaderElement.hidden = false;
            resultElement.hidden = true;
            loadButton.disabled = true;
            try {
                const response = await fetch("/api/productos/", {
                    headers: {"Authorization": `Bearer ${accessToken}`}
                });
                const data = await response.json();
                if (!response.ok) {
                    showError(data.detail || "No fue posible consultar productos.");
                    return;
                }

                statusElement.textContent = "Productos cargados correctamente.";
                resultElement.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                showError("No se pudo conectar con la API.");
            } finally {
                loaderElement.hidden = true;
                resultElement.hidden = false;
                loadButton.disabled = false;
            }
        });
    </script>
</body>
</html>
