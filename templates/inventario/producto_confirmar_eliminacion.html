{% extends 'inventario/base.html' %}

{% block title %}Eliminar producto{% endblock %}

{% block content %}
<div class="panel" style="max-width: 640px; margin: 0 auto;">
    <h1>Eliminar producto</h1>
    <p class="lead">¿Deseas eliminar <strong>{{ producto.nombre }}</strong>? Esta acción no se puede deshacer.</p>
    <div class="form-row" style="margin-top: 1rem;">
        <label>Stock actual</label>
        <div class="form-control" style="background: #f8fafc;">{{ producto.stock }} unidades</div>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="actions" style="margin-top: 1rem;">
            <button class="btn btn-danger" type="submit">Sí, eliminar</button>
            <a class="btn btn-secondary" href="{% url 'inventario:producto_detalle' producto.pk %}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
